<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEIS 201 Vocab Lab</title>
<style>
:root{--bg:#f9f9f7;--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#6b6a66;--grid:#e1e0d9;--acc:#2a78d6;--ok:#1baf7a;--bad:#eb6834;--gold:#eda100;--codebg:#f0efe9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0d0d;--surface:#1a1a19;--ink:#fff;--ink2:#c3c2b7;--muted:#a09f98;--grid:#2c2c2a;--acc:#3987e5;--ok:#199e70;--bad:#d95926;--gold:#c98500;--codebg:#111110}}
:root[data-theme="dark"]{--bg:#0d0d0d;--surface:#1a1a19;--ink:#fff;--ink2:#c3c2b7;--muted:#a09f98;--grid:#2c2c2a;--acc:#3987e5;--ok:#199e70;--bad:#d95926;--gold:#c98500;--codebg:#111110}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 56px}
h1{font-size:22px;margin:20px 0 2px}
.sub{color:var(--ink2);margin:0 0 12px}
h2{font-size:17px;margin:20px 0 8px}
.hud{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--grid);padding:8px 0;margin-bottom:8px}
.hudrow{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:14px;color:var(--ink2)}
.hudrow b{color:var(--ink)}
.track{height:6px;background:var(--grid);border-radius:3px;overflow:hidden;margin-top:6px}
.fill{height:100%;background:var(--gold);width:0;transition:width .3s}
.card{background:var(--surface);border:1px solid var(--grid);border-radius:12px;padding:12px 14px;margin:10px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:14px;padding:7px 12px;border-radius:20px;border:1px solid var(--grid);background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.mode{text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--grid);border-radius:12px;padding:12px 14px;cursor:pointer}
.mode:hover:not(:disabled){border-color:var(--acc)}
.mode:disabled{opacity:.5;cursor:not-allowed}
.mode b{display:block;font-size:16px}
.mode span{display:block;color:var(--ink2);font-size:14px}
.mode i{display:block;font-style:normal;color:var(--muted);font-size:13px;margin-top:4px}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.map{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}
.dot{width:20px;height:20px;line-height:20px;text-align:center;font-size:15px;color:var(--muted);cursor:default}
.dot.l{color:var(--gold)}.dot.m{color:var(--ok)}
.maplab{font-size:14px;color:var(--ink2);margin-top:10px}
.prompt{font-size:18px;font-weight:600;margin:6px 0 12px}
.qmeta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:4px;gap:8px;flex-wrap:wrap}
.opt{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--grid);border-radius:10px;padding:10px 12px;margin:8px 0;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt kbd{display:inline-block;min-width:20px;color:var(--muted);font:12px ui-monospace,monospace;margin-right:8px}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--bg))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--bg))}
.opt:disabled{cursor:default}
.fb{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:15px}
.fb.ok{background:color-mix(in srgb,var(--ok) 16%,var(--bg));border:1px solid var(--ok)}
.fb.no{background:color-mix(in srgb,var(--bad) 16%,var(--bg));border:1px solid var(--bad)}
.go,.sec{font:inherit;padding:9px 16px;border-radius:10px;cursor:pointer;border:1px solid var(--acc);margin:10px 8px 0 0}
.go{background:var(--acc);color:#fff}
.sec{background:var(--surface);color:var(--ink);border-color:var(--grid)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row input{font:inherit;flex:1;min-width:200px;padding:10px 12px;border:1px solid var(--grid);border-radius:10px;background:var(--bg);color:var(--ink)}
.hint{font:15px ui-monospace,monospace;letter-spacing:.08em;color:var(--ink2);margin:6px 0}
.bar{height:10px;background:var(--grid);border-radius:5px;overflow:hidden;margin:6px 0 10px}
.bar>div{height:100%;transition:width .25s}
.bar.time>div{background:var(--acc)}.bar.boss>div{background:var(--bad)}
.hearts{letter-spacing:.2em;color:var(--bad)}
.mult{display:inline-block;padding:1px 8px;border-radius:10px;background:var(--gold);color:#111;font-weight:700;font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.two{grid-template-columns:1fr}}
.pair{display:block;width:100%;text-align:left;font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--grid);border-radius:10px;padding:9px 11px;margin:6px 0;cursor:pointer}
.pair.sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.pair.gone{visibility:hidden}
.pair.shake{animation:shake .3s;border-color:var(--bad)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media(prefers-reduced-motion:reduce){.pair.shake{animation:none}.fill,.bar>div{transition:none}}
.stat{display:flex;gap:18px;flex-wrap:wrap;margin:8px 0}
.stat div{min-width:90px}.stat b{display:block;font-size:22px}.stat span{color:var(--muted);font-size:13px}
.missed li{margin:6px 0}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:24px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;text-align:center}
.toast.show{opacity:1}
details{margin:14px 0;color:var(--ink2)}summary{cursor:pointer}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;border:1px solid var(--gold);font-size:13px;margin:0 6px 6px 0}
footer{color:var(--muted);font-size:13px;margin-top:28px;border-top:1px solid var(--grid);padding-top:10px}
</style>
</head>
<body>
<div class="wrap">
<h1>SEIS 201 Vocab Lab</h1>
<p class="sub">Learn the course vocabulary by playing. Pick a word set, pick a mode, beat your own best.</p>
<div class="hud"><div class="hudrow"><span>Rank: <b id="rank"></b></span><span>Points: <b id="pts">0</b></span><span id="nextr"></span></div><div class="track"><div class="fill" id="rf"></div></div></div>
<main id="app"></main>
<footer>Definitions are drafts, not yet reviewed by a licensed engineer. Nothing you do here is saved or sent anywhere; reloading the page starts over.</footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const DATA={"concepts": [{"id": 1, "label": "Algebra Fundamentals", "def": "Rearranging equations and solving for an unknown symbol, such as turning stress = F/A into A = F/stress.", "tax": "FOUND", "unit": 0}, {"id": 2, "label": "Units and Dimensional Analysis", "def": "Tracking units through a calculation and converting between them; both sides of an equation must have matching dimensions.", "tax": "FOUND", "unit": 0}, {"id": 3, "label": "Significant Figures", "def": "Counting only the digits in a number that carry meaningful precision about an engineering value.", "tax": "FOUND", "unit": 0}, {"id": 4, "label": "Ratios and Percentages", "def": "Comparing two quantities as a fraction (ratio) or as parts per hundred (percent), such as 5% of a 200 kN load.", "tax": "FOUND", "unit": 0}, {"id": 5, "label": "Reading Plots and Graphs", "def": "Reading values, slopes, and trends off a graph, such as load versus displacement, and checking what the axes and units say.", "tax": "FOUND", "unit": 0}, {"id": 6, "label": "Static Equilibrium", "def": "A body at rest: forces sum to zero and moments sum to zero, so it neither moves nor rotates.", "tax": "FOUND", "unit": 0}, {"id": 7, "label": "Stress and Strain Basics", "def": "Stress is force per unit area (Pa or MPa); strain is fractional stretch, change in length divided by original length.", "tax": "FOUND", "unit": 0}, {"id": 8, "label": "Beam Bending Basics", "def": "How a beam curves and develops tension and compression when loaded; maximum bending stress is M times c divided by I.", "tax": "FOUND", "unit": 0}, {"id": 9, "label": "Spreadsheet Basics", "def": "Organizing data in rows and columns to automate repetitive engineering calculations for design checks.", "tax": "FOUND", "unit": 0}, {"id": 10, "label": "Tables and CSV Files", "def": "A table holds records in rows and variables in columns; a CSV file stores one as plain text with values separated by commas.", "tax": "FOUND", "unit": 0}, {"id": 11, "label": "Using a Chat Assistant", "def": "Asking an AI chat tool questions in plain language and checking its answers yourself before relying on them.", "tax": "FOUND", "unit": 0}, {"id": 12, "label": "Engineering Codes and Standards", "def": "Published requirements (codes, often adopted into law) and consensus documents (standards) that set minimum safety and performance criteria for designs.", "tax": "FOUND", "unit": 0}, {"id": 13, "label": "Artificial Intelligence", "def": "Computer systems that perform tasks normally needing human judgment, such as recognizing images or writing text.", "tax": "AIF", "unit": 1}, {"id": 14, "label": "Rule-Based Systems", "def": "Computer programs that make decisions using explicit if-then logic written by humans rather than learning from examples.", "tax": "AIF", "unit": 1}, {"id": 15, "label": "Machine Learning", "def": "Algorithms that improve at a task by finding patterns in example data instead of following hand-written rules.", "tax": "AIF", "unit": 1}, {"id": 16, "label": "Training Data", "def": "The example data a model learns from; its quality, coverage, and bias limit what the model can do.", "tax": "AIF", "unit": 1}, {"id": 17, "label": "Learned Patterns", "def": "Statistical regularities a model extracts from training data; they may not match any cause a person can name.", "tax": "AIF", "unit": 1}, {"id": 18, "label": "Rules Versus Learned Patterns", "def": "Rules are written by a person and behave predictably; learned patterns come from data, handle messy inputs, but can fail in unwritten ways.", "tax": "AIF", "unit": 1}, {"id": 19, "label": "Measurement and Why It Matters", "def": "Assigning a number and unit to a physical quantity with an instrument; design decisions rest on these numbers, which are never exact.", "tax": "STAT", "unit": 1}, {"id": 20, "label": "Repeated Measurements", "def": "Measuring the same quantity several times to see how much readings scatter and to average out random variation.", "tax": "STAT", "unit": 1}, {"id": 21, "label": "Range of Readings", "def": "Finding the difference between the highest and lowest values in a set of experimental data points.", "tax": "STAT", "unit": 1}, {"id": 22, "label": "Systematic Error and Accuracy", "def": "A consistent offset, such as a mis-zeroed scale, that pushes every reading the same way; accuracy is closeness to the true value.", "tax": "STAT", "unit": 1}, {"id": 23, "label": "Uncertainty Propagation", "def": "Working out how the uncertainties in input measurements combine to give the uncertainty of a calculated result.", "tax": "STAT", "unit": 1}, {"id": 24, "label": "Instrument Resolution", "def": "The smallest change a device can detect, limiting the precision of data collected from sensors or gauges.", "tax": "STAT", "unit": 1}, {"id": 25, "label": "Large Language Models and Tokens", "def": "AI models trained on huge text collections that read and write text in tokens, small chunks of a word (about three-quarters of a word each).", "tax": "LLM", "unit": 1}, {"id": 26, "label": "Probability Basics", "def": "A number from 0 (never) to 1 (certain) for how likely an event is; the chance of not-A is 1 minus the chance of A.", "tax": "STAT", "unit": 1}, {"id": 27, "label": "Next-Token Prediction", "def": "How a language model writes: given the text so far, it assigns probabilities to possible next tokens, picks one, and repeats.", "tax": "LLM", "unit": 1}, {"id": 28, "label": "Sampling and Temperature", "def": "Settings for picking the next token: low temperature favors the top choice (consistent), high temperature adds randomness (varied).", "tax": "LLM", "unit": 1}, {"id": 29, "label": "Prompts", "def": "Text instructions given to an AI model that shape the style and content of what it produces.", "tax": "LLM", "unit": 1}, {"id": 30, "label": "Hallucination", "def": "When an AI states something false or invented, such as a citation or a number, in a fluent, confident tone.", "tax": "LLM", "unit": 1}, {"id": 31, "label": "Checking Output Against Source", "def": "Comparing AI results to a trusted reference to ensure the answer is accurate and grounded in fact.", "tax": "VER", "unit": 1}, {"id": 32, "label": "Data Sets and Variables", "def": "A data set is a collection of observations, one per row; each property recorded for them is a variable, one per column.", "tax": "STAT", "unit": 1}, {"id": 33, "label": "Mean", "def": "The average value calculated by summing all measurements and dividing by the total count.", "tax": "STAT", "unit": 1}, {"id": 34, "label": "Variance and Standard Deviation", "def": "Measures of how much data points differ from the average; standard deviation is the square root of variance.", "tax": "STAT", "unit": 1}, {"id": 35, "label": "Coefficient of Variation", "def": "The ratio of the standard deviation to the mean, used to compare variability between different datasets.", "tax": "STAT", "unit": 1}, {"id": 36, "label": "Sample Versus Population", "def": "The population is everything you want to know about; the sample is the part you actually measured, used to estimate the whole.", "tax": "STAT", "unit": 1}, {"id": 37, "label": "Uncertainty From Spread", "def": "Using the scatter of repeated readings, such as their standard deviation, to state how uncertain a measured value is.", "tax": "STAT", "unit": 1}, {"id": 38, "label": "AI Agent", "def": "An AI system that works toward a goal you give it by choosing and taking steps, such as running tools, with little step-by-step human input.", "tax": "AGT", "unit": 1}, {"id": 39, "label": "Tool Use", "def": "The ability of an AI to trigger external software, like a calculator, to get precise results.", "tax": "AGT", "unit": 1}, {"id": 40, "label": "Multi-Step Planning", "def": "The process where an AI breaks a complex goal into a sequence of smaller, logical steps.", "tax": "AGT", "unit": 1}, {"id": 41, "label": "Agent Action Loop", "def": "A cycle where an AI observes a result, thinks about the next step, and acts until a task is done.", "tax": "AGT", "unit": 1}, {"id": 42, "label": "Sensor Data Stream", "def": "A continuous flow of timestamped readings from a sensor, such as strain or temperature, arriving as the measurement happens.", "tax": "DATA", "unit": 1}, {"id": 43, "label": "Threshold Check", "def": "Comparing a measurement against a set limit to trigger an alert if a value is too high or low.", "tax": "DATA", "unit": 1}, {"id": 44, "label": "Distribution", "def": "A description of how often each value, or range of values, occurs in a data set.", "tax": "STAT", "unit": 1}, {"id": 45, "label": "Histogram", "def": "A bar graph that shows the frequency of data falling within specific numerical ranges.", "tax": "STAT", "unit": 1}, {"id": 46, "label": "Normal Distribution", "def": "A symmetric bell-shaped distribution with most values near the mean and few far away; described by its mean and standard deviation.", "tax": "STAT", "unit": 1}, {"id": 47, "label": "Skewed Distribution", "def": "A lopsided distribution with a long tail on one side, so the mean and the median differ.", "tax": "STAT", "unit": 1}, {"id": 48, "label": "Outliers", "def": "Data points far from the rest; they may be mistakes or real events, so investigate before deleting them.", "tax": "STAT", "unit": 1}, {"id": 49, "label": "Auditing an Agent's Analysis", "def": "Checking each step an AI agent took, including its data, code, and numbers, for mistakes before relying on its conclusion.", "tax": "VER", "unit": 1}, {"id": 50, "label": "AI Bias", "def": "Systematic errors in AI output caused by flawed data, leading to incorrect or unfair results.", "tax": "BIAS", "unit": 2}, {"id": 51, "label": "Training Data Bias", "def": "Errors introduced when the data used to teach an AI does not accurately represent the real world.", "tax": "BIAS", "unit": 2}, {"id": 52, "label": "Representative Sample", "def": "A small group that accurately reflects the characteristics of the entire population being studied.", "tax": "BIAS", "unit": 2}, {"id": 53, "label": "Distribution Shift", "def": "When the data an AI encounters in the real world differs from the data it was trained on.", "tax": "BIAS", "unit": 2}, {"id": 54, "label": "Out-of-Domain Use", "def": "Applying an AI to a problem or material it was not specifically designed or trained to handle.", "tax": "BIAS", "unit": 2}, {"id": 55, "label": "Training Coverage Gap", "def": "A lack of specific scenarios in the training set, leaving the AI unable to handle those cases.", "tax": "BIAS", "unit": 2}, {"id": 56, "label": "Scatter Plot", "def": "A graph of individual data points plotted on two axes to visualize the relationship between variables.", "tax": "INF", "unit": 2}, {"id": 57, "label": "Correlation Coefficient", "def": "A number between -1 and 1 describing the strength and direction of a linear relationship between variables.", "tax": "INF", "unit": 2}, {"id": 58, "label": "Linear Regression", "def": "Finding the best-fit straight line through data points to predict one variable based on another.", "tax": "INF", "unit": 2}, {"id": 59, "label": "R-Squared", "def": "A value from 0 to 1 showing how much of the variation in data is explained by a model.", "tax": "INF", "unit": 2}, {"id": 60, "label": "Correlation Versus Causation", "def": "The distinction that two things moving together does not mean one actually causes the other to happen.", "tax": "INF", "unit": 2}, {"id": 61, "label": "Spurious Correlation", "def": "A relationship between two variables that looks meaningful but is actually caused by a third factor or random chance.", "tax": "INF", "unit": 2}, {"id": 62, "label": "AI Overconfidence", "def": "When an AI presents a wrong answer with high certainty, which can mislead engineers during safety-critical checks.", "tax": "BIAS", "unit": 2}, {"id": 63, "label": "False Precision", "def": "Reporting a number with more digits than the measuring tool can actually provide, suggesting a precision that doesn't exist.", "tax": "BIAS", "unit": 2}, {"id": 64, "label": "Statistical Basis for a Claim", "def": "Using probability and data to support a conclusion instead of relying on a single measurement or a guess.", "tax": "BIAS", "unit": 2}, {"id": 65, "label": "Random Sampling", "def": "Selecting a subset of data by chance so every single member has an equal probability of being picked.", "tax": "INF", "unit": 2}, {"id": 66, "label": "Sampling Variability", "def": "The natural difference in results that occurs when different random subsets are taken from the same population.", "tax": "INF", "unit": 2}, {"id": 67, "label": "Standard Error", "def": "How much a sample mean is expected to vary from the true mean; estimated as s divided by the square root of n.", "tax": "INF", "unit": 2}, {"id": 68, "label": "The t Multiplier", "def": "The factor, near 2 for large samples and bigger for small ones, that multiplies the standard error to set an interval's width.", "tax": "INF", "unit": 2}, {"id": 69, "label": "Confidence Interval", "def": "A range built from sample data that captures the true mean in a stated share (such as 95%) of repeated samples.", "tax": "INF", "unit": 2}, {"id": 70, "label": "Confidence Level", "def": "How often the interval-building method captures the true value across repeated samples, such as 95% of the time.", "tax": "INF", "unit": 2}, {"id": 71, "label": "Significance and P-Values", "def": "A p-value is the chance of a result at least this extreme if there were no real effect; small values suggest it isn't chance.", "tax": "INF", "unit": 2}, {"id": 72, "label": "Dashboard and Metrics", "def": "A screen showing key measured numbers (metrics), often as charts, so a system's state can be read at a glance.", "tax": "DATA", "unit": 2}, {"id": 73, "label": "Time Series Data", "def": "A sequence of measurements taken at consistent intervals over time to track changes or trends.", "tax": "DATA", "unit": 2}, {"id": 74, "label": "Agent-Built Report", "def": "A summary document produced by an AI, requiring human verification to ensure the technical conclusions are sound.", "tax": "AGT", "unit": 2}, {"id": 75, "label": "Agent Autonomy", "def": "The ability of an AI to make decisions and execute tasks without needing constant human input.", "tax": "AGT", "unit": 2}, {"id": 76, "label": "Human Review Checkpoint", "def": "A planned stop in an automated process where a human must verify the AI's work before it continues.", "tax": "AGT", "unit": 2}, {"id": 77, "label": "Chart Type Selection", "def": "Picking the most effective visual representation to make data relationships easy to understand.", "tax": "DATA", "unit": 2}, {"id": 78, "label": "Axis Scales and Baselines", "def": "The range, starting value (baseline), and spacing (linear or log) of a graph's axes, which shape how big a trend looks.", "tax": "DATA", "unit": 2}, {"id": 79, "label": "Misleading Charts", "def": "Graphs whose scale, baseline, or choice of data leaves the viewer with a false impression, deliberately or not.", "tax": "DATA", "unit": 2}, {"id": 80, "label": "Critiquing AI-Generated Charts", "def": "Evaluating AI-made visuals for inaccuracies in scale or logic to ensure they don't misrepresent engineering data.", "tax": "DATA", "unit": 2}, {"id": 81, "label": "Data Pipeline", "def": "A system of automated steps that moves raw data from a source to a final destination for analysis.", "tax": "DATA", "unit": 2}, {"id": 82, "label": "Data Ingestion", "def": "The initial process of pulling raw data from sensors or files into a software system.", "tax": "DATA", "unit": 2}, {"id": 83, "label": "Unit and Format Mismatch", "def": "Errors when values in different units (meters versus feet) or formats (date styles, decimal commas) are mixed as if they matched.", "tax": "DATA", "unit": 2}, {"id": 84, "label": "Data Cleaning", "def": "The process of fixing or removing incorrect, duplicate, or irrelevant data before analyzing it.", "tax": "DATA", "unit": 2}, {"id": 85, "label": "Missing and Bad Data", "def": "Gaps or incorrect entries in a dataset that can lead to wrong conclusions if not properly addressed.", "tax": "DATA", "unit": 2}, {"id": 86, "label": "Errors Through a Pipeline", "def": "How a mistake made early in a pipeline is carried into every later step and can grow into a large error in the result.", "tax": "DATA", "unit": 2}, {"id": 87, "label": "Variables and Data Types", "def": "Named containers for data, classified by types such as whole numbers, decimals, or text strings.", "tax": "CODE", "unit": 3}, {"id": 88, "label": "Functions and Imports", "def": "A function is a named, reusable block of code; an import loads a library of ready-made functions into your program.", "tax": "CODE", "unit": 3}, {"id": 89, "label": "Conditionals and Loops", "def": "A conditional (if/else) picks which code runs based on a test; a loop repeats code for each item or until a test fails.", "tax": "CODE", "unit": 3}, {"id": 90, "label": "Reading Error Messages", "def": "Reading a program's error message, starting from the last line, to find what failed and where.", "tax": "CODE", "unit": 3}, {"id": 91, "label": "AI Code Generation Internals", "def": "How an AI predicts code by identifying patterns from millions of existing software examples.", "tax": "CODE", "unit": 3}, {"id": 92, "label": "Plausible but Wrong Code", "def": "Code that looks professional and logical but contains hidden errors that can cause engineering failures.", "tax": "CODE", "unit": 3}, {"id": 93, "label": "Python Script", "def": "A plain-text file of Python instructions that a computer runs from top to bottom, such as to automate a calculation.", "tax": "CODE", "unit": 3}, {"id": 94, "label": "Prompting for Code", "def": "Writing a detailed request to an AI to generate a specific piece of software.", "tax": "CODE", "unit": 3}, {"id": 95, "label": "Running a Script", "def": "Executing a set of saved instructions through a computer program to produce a final result.", "tax": "CODE", "unit": 3}, {"id": 96, "label": "Vibe Coding", "def": "Building software by describing the desired outcome to an AI, often without reading the code it produces.", "tax": "CODE", "unit": 3}, {"id": 97, "label": "Plain-Language Specification", "def": "A detailed description of a program's requirements written in normal English to guide an AI.", "tax": "CODE", "unit": 3}, {"id": 98, "label": "Describe-Generate-Test Loop", "def": "The cycle of requesting code, testing it for errors, and refining the prompt until it works.", "tax": "CODE", "unit": 3}, {"id": 99, "label": "Test Case", "def": "A specific set of inputs and the expected result used to verify a program's accuracy.", "tax": "VER", "unit": 3}, {"id": 100, "label": "Reading AI-Generated Code", "def": "Reading code an AI wrote to check that it does what you asked, uses the right formulas and units, and hides no mistakes.", "tax": "CODE", "unit": 3}, {"id": 101, "label": "Agentic Coding Tool", "def": "AI software that can write, execute, and fix its own code to solve a technical problem autonomously.", "tax": "AGT", "unit": 3}, {"id": 102, "label": "Unit Tests and Test Runner", "def": "Small automated checks and the software used to run them to verify that a program works correctly.", "tax": "VER", "unit": 3}, {"id": 103, "label": "Agent-Written Tests", "def": "Automated verification checks created by an AI to test if its own generated code is correct.", "tax": "VER", "unit": 3}, {"id": 104, "label": "Analytical Solution", "def": "An exact mathematical answer derived from formulas, used to verify that a computer's approximation is accurate.", "tax": "VER", "unit": 3}, {"id": 105, "label": "Numerical Tolerance", "def": "The small, acceptable difference between a calculated value and the true value, often written as a small decimal.", "tax": "VER", "unit": 3}, {"id": 106, "label": "Tests Written by the Same AI", "def": "Verification checks created by the same model that wrote the code, which may repeat the same logic errors.", "tax": "VER", "unit": 3}, {"id": 107, "label": "Known-Answer Check", "def": "Comparing a computer's result to a value already proven correct in a textbook or industry standard.", "tax": "VER", "unit": 3}, {"id": 108, "label": "Hand Calculation Check", "def": "Manually solving a simplified version of a problem to ensure a program's logic is sound.", "tax": "VER", "unit": 3}, {"id": 109, "label": "Unit and Dimension Check", "def": "Confirming that a result comes out in the right units and dimensions, such as newtons for force or pascals for stress.", "tax": "VER", "unit": 3}, {"id": 110, "label": "Order-of-Magnitude Check", "def": "Quickly checking that a result is the right size, within about a factor of ten, to catch large errors.", "tax": "VER", "unit": 3}, {"id": 111, "label": "Edge Cases and Limits", "def": "Testing a program with extreme or unusual inputs to see if the software crashes or fails.", "tax": "VER", "unit": 3}, {"id": 112, "label": "Investigating a Discrepancy", "def": "Finding the reason why two different calculation methods produced different results for the same problem.", "tax": "VER", "unit": 3}, {"id": 113, "label": "Software Bug", "def": "A flaw in a computer program that causes it to produce an incorrect or unexpected result.", "tax": "DBG", "unit": 3}, {"id": 114, "label": "Debugging", "def": "The process of identifying and fixing errors in a computer program.", "tax": "DBG", "unit": 3}, {"id": 115, "label": "Isolating a Failing Step", "def": "Breaking a complex process into smaller parts to find exactly where a mistake is happening.", "tax": "DBG", "unit": 3}, {"id": 116, "label": "Multi-Step Agent Workflow", "def": "A sequence of tasks where an AI passes the output of one step as the input for the next.", "tax": "AGT", "unit": 3}, {"id": 117, "label": "Tracing an Agent Failure", "def": "Reviewing the sequence of an AI's decisions to find where its logic went wrong.", "tax": "DBG", "unit": 3}, {"id": 118, "label": "Compounding Workflow Errors", "def": "When a small error in an early step of an automated process creates a larger error in later steps.", "tax": "DBG", "unit": 3}, {"id": 119, "label": "Debugging With AI", "def": "Using an AI assistant to explain error messages and suggest fixes for broken code.", "tax": "DBG", "unit": 3}, {"id": 120, "label": "Giving AI Error Context", "def": "Providing an AI with the specific error message and the current code to help it find a solution.", "tax": "DBG", "unit": 3}, {"id": 121, "label": "Root Cause Versus Symptom", "def": "The difference between the fundamental flaw causing a bug and the visible error it produces.", "tax": "DBG", "unit": 3}, {"id": 122, "label": "Re-Testing After a Fix", "def": "Running a program again after a change to ensure the bug is gone and no new errors were added.", "tax": "DBG", "unit": 3}, {"id": 123, "label": "Scoping a Design Tool", "def": "Defining the specific limits and intended uses of a software tool to prevent it from being used incorrectly.", "tax": "DES", "unit": 3}, {"id": 124, "label": "Iterative Design Loop", "def": "A repetitive cycle of prototyping, testing, and refining a design until it meets all requirements.", "tax": "DES", "unit": 4}, {"id": 125, "label": "Design Across Load Cases", "def": "Ensuring a structure works under various conditions, such as maximum wind, snow, and seismic loads.", "tax": "DES", "unit": 4}, {"id": 126, "label": "Parameter Sweep", "def": "Running a calculation or simulation many times while varying one or more inputs to see how they affect the result.", "tax": "DES", "unit": 4}, {"id": 127, "label": "Design Convergence", "def": "When repeated design adjustments lead to a stable solution that no longer changes significantly.", "tax": "DES", "unit": 4}, {"id": 128, "label": "Agent Drift From Requirements", "def": "When an AI slowly deviates from the original project specifications during a long, multi-step process.", "tax": "DES", "unit": 4}, {"id": 129, "label": "Engineering Calculation Tool", "def": "Software used to perform complex math, such as beam analysis, to speed up the design process.", "tax": "DES", "unit": 4}, {"id": 130, "label": "Inputs and Outputs", "def": "The data entered into a system and the results it produces based on those entries.", "tax": "DES", "unit": 4}, {"id": 131, "label": "Input Validation", "def": "Checking that data entered into a program is within realistic physical limits before processing it.", "tax": "DES", "unit": 4}, {"id": 132, "label": "Documented Assumptions", "def": "A written record of the assumptions and simplifications behind a design, such as loads and material values, so others can check the logic.", "tax": "DES", "unit": 4}, {"id": 133, "label": "Validating Against a Reference", "def": "Comparing a software's result to a known correct answer from a textbook or lab test.", "tax": "DES", "unit": 4}, {"id": 134, "label": "AI Research Assistant", "def": "AI that finds and summarizes technical information faster than manual searching; its sources and claims still need checking.", "tax": "AGT", "unit": 4}, {"id": 135, "label": "Literature Summary", "def": "A condensed version of research papers that highlights the key findings relevant to a project.", "tax": "DES", "unit": 4}, {"id": 136, "label": "Citation and Source Verification", "def": "Checking that a quoted fact actually exists in the original source and is attributed correctly.", "tax": "VER", "unit": 4}, {"id": 137, "label": "Design Tradeoff and Objectives", "def": "Balancing competing goals, such as reducing cost while increasing structural strength.", "tax": "DES", "unit": 4}, {"id": 138, "label": "AI-Assisted Tradeoff Analysis", "def": "Using AI to quickly compare different design options to find the best balance of competing goals.", "tax": "DES", "unit": 4}, {"id": 139, "label": "Engineering Judgment", "def": "Using professional experience and physics knowledge to decide if a result is reasonable, regardless of what a tool says.", "tax": "DES", "unit": 4}, {"id": 140, "label": "Risk and Consequence", "def": "Assessing the probability of a failure and the potential harm it could cause to people or the environment.", "tax": "ETH", "unit": 5}, {"id": 141, "label": "Failure Mode", "def": "The specific way in which a component or system fails to perform its intended function.", "tax": "ETH", "unit": 5}, {"id": 142, "label": "Autonomous AI Systems", "def": "Software that makes and executes decisions without human intervention, posing unique safety and legal challenges.", "tax": "ETH", "unit": 5}, {"id": 143, "label": "Human in the Loop", "def": "A requirement that a qualified person must review and approve an AI's decision before implementation.", "tax": "ETH", "unit": 5}, {"id": 144, "label": "Accountability for AI Decisions", "def": "The principle that the licensed engineer, not the software, answers for a design's safety; exact legal liability depends on the situation.", "tax": "ETH", "unit": 5}, {"id": 145, "label": "AI Ethics", "def": "The study of how to use AI responsibly, focusing on safety, fairness, and transparency.", "tax": "ETH", "unit": 5}, {"id": 146, "label": "Explainability", "def": "How well a person can understand and describe why an AI produced a given result; for many models this is only partial.", "tax": "ETH", "unit": 5}, {"id": 147, "label": "Verifying Agent Output", "def": "Checking the final work of an AI to ensure it is technically sound and meets all specifications.", "tax": "VER", "unit": 5}, {"id": 148, "label": "Code Compliance Check", "def": "Checking that a design meets the adopted building codes and standards that apply to it.", "tax": "VER", "unit": 5}, {"id": 149, "label": "Independent Verification", "def": "Having a second, unrelated person or team check calculations to catch overlooked errors.", "tax": "VER", "unit": 5}, {"id": 150, "label": "Verification Checklist", "def": "A standardized list of checks to ensure every part of a design has been reviewed and validated.", "tax": "VER", "unit": 5}, {"id": 151, "label": "Documenting and Tracing Checks", "def": "Keeping a written record of every verification step to provide evidence that a design is safe.", "tax": "VER", "unit": 5}, {"id": 152, "label": "Safety-Critical System", "def": "A system where a failure could result in serious injury, loss of life, or significant environmental damage.", "tax": "ETH", "unit": 5}, {"id": 153, "label": "Licensure and the PE Stamp", "def": "A state license to offer engineering services to the public; the PE stamp shows a licensed engineer did or directly supervised the work.", "tax": "ETH", "unit": 5}, {"id": 154, "label": "Responsible Charge", "def": "Direct control and personal supervision of engineering work by a licensed engineer, who cannot simply sign off on work others did.", "tax": "ETH", "unit": 5}, {"id": 155, "label": "AI-Assisted Accountability", "def": "The practice of using AI to help document work while maintaining that the human engineer is ultimately responsible.", "tax": "ETH", "unit": 5}, {"id": 156, "label": "Disclosing AI Use", "def": "Stating when and how AI was used in a project so reviewers, clients, and regulators know what to check.", "tax": "ETH", "unit": 5}, {"id": 157, "label": "Limits of AI", "def": "What AI cannot be relied on to do, such as guarantee correctness, apply physics it was not shown, or handle new situations.", "tax": "ETH", "unit": 5}, {"id": 158, "label": "Missed Failure Modes and Codes", "def": "Situations where AI fails to identify possible failure modes or ignores the building codes that apply.", "tax": "ETH", "unit": 5}, {"id": 159, "label": "Conditions Beyond Training", "def": "Situations that are so unusual they were not part of the AI's training data, making its predictions unreliable.", "tax": "ETH", "unit": 5}, {"id": 160, "label": "Tacit Knowledge and Physics Gaps", "def": "Know-how engineers gain from experience that is hard to write down, plus physical understanding that AI pattern-matching may lack.", "tax": "ETH", "unit": 5}, {"id": 161, "label": "Judgment Catching AI Errors", "def": "Using professional experience to spot and correct AI mistakes that look plausible but violate physical laws.", "tax": "ETH", "unit": 5}, {"id": 162, "label": "When Not to Use AI", "def": "Deciding against using AI when the risk of error is too high or when a precise, verifiable manual calculation is required.", "tax": "ETH", "unit": 5}, {"id": 163, "label": "Reflecting on AI Use", "def": "Evaluating how AI influenced a design process to improve future reliability and maintain professional standards.", "tax": "ETH", "unit": 5}], "tax": {"FOUND": "Assumed Foundations", "AIF": "AI Fundamentals", "LLM": "Large Language Models", "AGT": "Agentic AI", "STAT": "Measurement and Descriptive Statistics", "INF": "Inference and Regression", "BIAS": "Bias and Overconfidence", "DATA": "Data Pipelines and Visualization", "CODE": "Programming and Code Generation", "VER": "Verification and Testing", "DBG": "Debugging", "ENG": "Engineering Applications", "DES": "Design Tools and Research", "ETH": "Ethics, Risk and Licensure"}, "units": {"0": {"short": "Before class", "name": "Expected on entry or lab-supplied"}, "1": {"short": "Unit 1: How AI works", "name": "Unit 1 (Feb 2-18): How AI works, describing data"}, "2": {"short": "Unit 2: Judging claims", "name": "Unit 2 (Feb 23-Mar 18): Judging AI and data claims"}, "3": {"short": "Unit 3: AI coding", "name": "Unit 3 (Mar 30-Apr 15): AI-assisted coding and verification"}, "4": {"short": "Unit 4: Building tools", "name": "Unit 4 (Apr 20-27): Building tools and research"}, "5": {"short": "Unit 5: Responsibility", "name": "Unit 5 (Apr 29-finals): Responsibility, verification, limits"}}, "confusable": [[107, 133], [86, 118], [31, 136], [31, 147], [49, 147], [50, 51], [55, 159], [76, 143], [144, 155], [60, 61], [38, 101], [75, 142], [37, 67], [103, 106], [119, 120], [54, 159], [53, 159]], "rel": {"1": [2, 3, 4, 5, 111, 108, 7, 8, 14, 23, 33, 58], "2": [1, 5, 3 const hintText=l=>l.split(' ').map(w=>w[0]+'_'.repeat(Math.max(0,w.length-1))).join('  ');
const norm=s=>s.toLowerCase().replace(/\bversus\b/g,'vs').replace(/&/g,'and').replace(/[^a-z0-9]/g,'');
function lev(a,b){const m=a.length,n=b.length;let p=[...Array(n+1).keys()];for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function answerRecall(){const q=run.cur;if($('nx'))return;const a=norm($('ans').value);if(!a)return;q.tries++;
 const t=norm(q.t.label);if(lev(a,t)<=Math.max(1,Math.floor(t.length*0.12)))return finish(true,q.t,'');
 $('fb').innerHTML=`<div class="fb no">Not quite. ${q.tries>=2?'Use the hint or give up to see the answer.':'Try again.'}</div>`}
function answerMC(i){const q=run.cur;if($('nx')||run.locked)return;run.locked=true;const ok=i===q.ans;
 document.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(k===q.ans)b.classList.add('right');else if(k===i)b.classList.add('wrong')});
 finish(ok,q.t,'mc')}
function finish(ok,t,kind){const q=run.cur;let msg;
 if(ok){run.streak++;run.ok++;const w=q.type==='recall'?(q.hint?1:2):1;const g=100*mult()*w;run.score+=g;addPts(g);upd(t.id,true,q.type==='recall'?2:1);S.bestStreak=Math.max(S.bestStreak,run.streak);if(run.streak>=10)badge('streak10','Ten in a row');
  msg=`<div class="fb ok"><b>Correct, +${g}.</b> ${esc(t.label)}: ${esc(t.def)}</div>`}
 else{run.streak=0;run.bad++;run.missed.push(t);upd(t.id,false);run.re.push({id:t.id,at:run.q+3});if(run.mode==='speed')run.t=Math.max(0,run.t-3);if(run.mode==='boss')run.lives--;
  msg=`<div class="fb no"><b>Not this time.</b> ${esc(t.label)}: ${esc(t.def)}</div>`}
 run.q++;
 if(run.mode==='speed'){if(run.t<=0)return endRun();$('fb').innerHTML=msg;setTimeout(()=>{if(run&&run.mode==='speed'&&run.q>0)nextQ()},ok?350:1400);return}
 const last=(run.total&&run.q>=run.total)||(run.mode==='boss'&&run.lives<=0);
 $('fb').innerHTML=msg+`<button class="go" id="nx">${last?'See results':'Next'}</button>`;
 $('nx').onclick=()=>last?endRun():nextQ();$('nx').focus()}
/* ---------- match ---------- */
function themed(n){const seed=targets(1)[0];if(!seed)return[];const ids=new Set(pool().map(c=>c.id)),ts=[seed];
 for(const id of (DATA.rel[seed.id]||[])){if(ts.length>=n)break;const c=byId.get(id);if(ids.has(id)&&!ts.some(x=>isConf(x.id,id)))ts.push(c)}
 if(ts.length<n)for(const c of targets(n,ts.map(x=>x.id))){if(ts.length<n&&!ts.some(x=>isConf(x.id,c.id)))ts.push(c)}
 return ts}
function matchRound(){clearRun();const ts=themed(6);if(ts.length<2)return home();
 const m=run.m={ts,L:shuffle(ts),R:shuffle(ts),gone:new Set(),sl:null,sr:null,miss:new Set(),t0:Date.now(),streak:0,pts:0};
 m.iv=setInterval(()=>{const e=$('mt');if(e)e.textContent=Math.floor((Date.now()-m.t0)/1000)+'s'},500);timer=m.iv;mdraw()}
function mdraw(){const m=run.m;
 $('app').innerHTML=`<div class="card"><div class="qmeta"><span>Tap a term, then its definition</span><span>Time <b id="mt">${Math.floor((Date.now()-m.t0)/1000)}s</b> &nbsp; Score ${run.score.toLocaleString()} ${m.streak?`<span class="mult">x${Math.min(4,1+Math.floor((m.streak-1)/3))}</span>`:''}</span></div>
 <div class="two"><div>${m.L.map(c=>`<button class="pair ${m.gone.has(c.id)?'gone':''} ${m.sl===c.id?'sel':''}" data-s="l" data-id="${c.id}">${esc(c.label)}</button>`).join('')}</div><div>${m.R.map(c=>`<button class="pair ${m.gone.has(c.id)?'gone':''} ${m.sr===c.id?'sel':''}" data-s="r" data-id="${c.id}">${esc(maskText(c.def,m.ts.map(x=>x.label)))}</button>`).join('')}</div></div></div><button class="sec" id="quit">Quit to menu</button>`;
 $('quit').onclick=()=>{clearRun();home()};
 document.querySelectorAll('.pair').forEach(b=>b.onclick=()=>mpick(b.dataset.s,+b.dataset.id,b))}
function mpick(side,id,btn){const m=run.m;if(side==='l')m.sl=m.sl===id?null:id;else m.sr=m.sr===id?null:id;
 if(m.sl!==null&&m.sr!==null){
  if(m.sl===m.sr){const first=!m.miss.has(id);m.streak++;const g=100*Math.min(4,1+Math.floor((m.streak-1)/3));run.score+=g;m.pts+=g;addPts(g);upd(id,true,first?1:0);run.ok++;m.gone.add(id);m.sl=m.sr=null;
   if(m.gone.size===m.ts.length){clearRun();const sec=(Date.now()-m.t0)/1000,bonus=Math.max(0,Math.round(300-sec*5));run.score+=bonus;addPts(bonus);run.bonus=bonus;run.sec=sec;return endRun()}
   mdraw()}
  else{m.streak=0;run.bad++;m.miss.add(m.sl);m.miss.add(m.sr);upd(m.sl,false);const a=m.sl,b=m.sr;m.sl=m.sr=null;mdraw();
   document.querySelectorAll('.pair').forEach(x=>{if(+x.dataset.id===a&&x.dataset.s==='l'||+x.dataset.id===b&&x.dataset.s==='r')x.classList.add('shake')})}
 }else mdraw()}
/* ---------- end ---------- */
function endRun(){clearRun();const r=run;if(!r)return;
 const key=r.mode,newBest=r.score>(S.best[key]||0)&&r.score>0;if(newBest)S.best[key]=r.score;
 let title='Round complete',extra='';
 if(r.mode==='boss'){const won=r.lives>0&&r.q>=r.total;if(won){const bonus=500;r.score+=bonus;addPts(bonus);badge('boss'+bossUnit(),BOSS[bossUnit()]+' defeated');title=`${BOSS[bossUnit()]} defeated (+500)`;if(r.bad===0)badge('flawless','Flawless boss')}else title=`${BOSS[bossUnit()]} won this time`}
 if(r.mode==='speed')title='Time';
 if(r.mode==='match')extra=`<div>Cleared in ${Math.round(r.sec||0)}s${r.bonus?`, speed bonus +${r.bonus}`:''}.</div>`;
 const p=pool();if(p.length&&p.every(c=>M(c.id).box>=3))badge('set'+[...S.sel].sort().join(''),'Set mastered');
 const total=r.ok+r.bad,acc=total?Math.round(r.ok/total*100):0;
 const miss=[...new Map(r.missed.map(c=>[c.id,c])).values()];
 $('app').innerHTML=`<div class="card"><h2 style="margin-top:0">${esc(title)}</h2><div class="stat"><div><b>${r.score.toLocaleString()}</b><span>score${newBest?' (new best)':''}</span></div><div><b>${r.ok}</b><span>correct</span></div><div><b>${acc}%</b><span>accuracy</span></div><div><b>${S.bestStreak}</b><span>best streak</span></div></div>${extra}
 ${miss.length?`<h2>Words to revisit</h2><ul class="missed">${miss.map(c=>`<li><b>${esc(c.label)}</b>: ${esc(c.def)}</li>`).join('')}</ul>`:'<p>No misses. Clean round.</p>'}
 <button class="go" id="again">Play again</button><button class="sec" id="hm">Back to menu</button></div>`;
 $('again').onclick=()=>start(r.mode);$('hm').onclick=home;run=null}
document.addEventListener('keydown',e=>{if(keyHandler)keyHandler(e)});
hud();home();
</script>
</body>
